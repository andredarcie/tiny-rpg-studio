<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Example plugin</title>
  <script id="tiny-rpg-plugin" type="application/json">
    {
      "id": "example-plugin",
      "title": "Example plugin",
      "shortDescription": "Swap Tiles and NPCs to the top and hide World.",
      "fullDescription": "Moves Tiles to the top of the right column and NPCs to the top of the left column. Use Project > Plugins > Flip to restore their original positions. Hides the entire World section. Removal restores the layout. Runs trusted code in your editor only.",
      "version": "1.0.1",
      "apiVersion": 1
    }
  </script>
  <style data-tiny-rpg-plugin>
    #tab-editor .editor-section--world,
    #tab-editor [data-mobile-target="world"] { display: none; }
  </style>
  <script type="module" data-tiny-rpg-plugin>
    export function activate({ editorRoot, onCleanup, registerSettings }) {
      const positions = [];
      for (const [panelSelector, columnSelector] of [
        ['.editor-section--tiles', '.editor-right'],
        ['.editor-section--npcs', '.editor-left']
      ]) {
        const panel = editorRoot.querySelector(panelSelector);
        const column = editorRoot.querySelector(columnSelector);
        if (!panel || !column) throw new Error('Required editor panels are missing');
        const placeholder = document.createComment('example-plugin panel position');
        const parent = panel.parentNode;
        const next = panel.nextSibling;
        positions.push({ panel, column, placeholder, parent, next });
        onCleanup(() => {
          if (placeholder.parentNode) placeholder.replaceWith(panel);
          else parent.insertBefore(panel, next?.parentNode === parent ? next : null);
        });
      }
      registerSettings(container => {
        const label = document.createElement('label');
        label.className = 'project-test__field project-test__checkbox project-appearance__checkbox';
        const checkbox = document.createElement('input');
        checkbox.id = 'example-plugin-flip';
        checkbox.type = 'checkbox';
        checkbox.checked = true;
        const text = document.createElement('span');
        text.textContent = 'Flip';
        label.append(checkbox, text);
        container.append(label);
        const update = () => {
          for (const { panel, column, placeholder, parent, next } of positions) {
            if (checkbox.checked) {
              if (!placeholder.parentNode) panel.before(placeholder);
              column.prepend(panel);
            } else if (placeholder.parentNode) placeholder.replaceWith(panel);
            else parent.insertBefore(panel, next?.parentNode === parent ? next : null);
          }
        };
        onCleanup(() => checkbox.removeEventListener('change', update));
        checkbox.addEventListener('change', update);
        update();
      });
    }
  </script>
</head>
<body></body>
</html>
